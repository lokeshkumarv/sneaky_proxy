services:
  preflight:
    container_name: sneaky_proxy
    build:
      context: ./
      dockerfile: Dockerfile
      network: host
      args:
        - 'REDIRECT_URL=${REDIRECT_URL}'
        - 'PROXY_DOMAIN=${PROXY_DOMAIN}'
        - 'HIDDEN_HOST=${HIDDEN_HOST}'

    image: sneaky_proxy
    ports:
      - "443:443"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        
